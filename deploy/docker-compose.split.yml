# =============================================================================
# Overlay: split the stack across hosts (Shape B)
# =============================================================================
# The number of servers stays a choice of overlay, never a different stack.
# This overlay assigns every service to one of two profiles:
#   news    - the app host (news-engine, Temporal, WhatsApp)
#   gateway - the GPU host (the TTS gateway)
# The OmniVoice sidecar keeps its own opt-in "omnivoice" profile (defined in the
# base file) and is intentionally not listed here.
#
# Usage:
#   app host:    docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.split.yml \
#                  --profile news up -d
#   GPU host:    docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.split.yml \
#                  --profile gateway -f deploy/docker-compose.gpu.yml up -d
#
# Or put the selection in deploy/.env:  COMPOSE_PROFILES=news
#
# narration-modal-worker keeps its own "modal" profile (opt-in), so it is NOT
# listed here: activating "news" must not start the paid Modal worker.
# In Shape B, point the news host at the GPU host:
#   TTS_API_BASE_URL=http://<gpu-host>:8001/api/v1   (in apps/news/.env)
# =============================================================================

services:
  api:
    profiles: ["news"]
  worker:
    profiles: ["news"]
  narration-worker:
    profiles: ["news"]
  doc-tts-worker:
    profiles: ["news"]
  audiobook-worker:
    profiles: ["news"]
  teacher-worker:
    profiles: ["news"]
  voice-catalog-worker:
    profiles: ["news"]
  there:
    profiles: ["news"]
  temporal-postgres:
    profiles: ["news"]
  temporal:
    profiles: ["news"]
  temporal-ui:
    profiles: ["news"]

  gateway:
    profiles: ["gateway"]
