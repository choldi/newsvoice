<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Helvetica,Arial,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f5f7;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" max-width="100%" cellspacing="0" cellpadding="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:#1a73e8;padding:20px 32px;color:#ffffff;">
              <h1 style="margin:0;font-size:20px;line-height:1.3;">Daily News Digest</h1>
              <p style="margin:4px 0 0;font-size:13px;opacity:.9;">{{ collection }} &middot; {{ date }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <div style="font-size:15px;line-height:1.6;">{{ body | safe }}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;border-top:1px solid #e4e7eb;font-size:12px;color:#7b8794;">
              Generado autom&aacute;ticamente por News Engine.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
