services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_engine_api
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./collections.toml:/app/collections.toml
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_engine_worker
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./collections.toml:/app/collections.toml:ro
      # Read-only Docker socket so the system monitor can inspect the container
      # health of every news-engine service. Root-equivalent on the host: only
      # mount in trusted/self-hosted deploys.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["python", "-m", "src.workers.run_worker"]
    restart: unless-stopped

  narration-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_engine_narration_worker
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./collections.toml:/app/collections.toml:ro
    command: ["python", "-m", "src.workers.run_narration_worker"]
    restart: unless-stopped

  # Modal narration worker (Phase 7.8). Declared behind the "modal" profile so
  # it is created but NOT started: no collection uses a Modal backend yet, so
  # there is no spend and no GPU to pay for. Start it with:
  #   docker compose --profile modal up -d narration-modal-worker
  narration-modal-worker:
    profiles: ["modal"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_engine_narration_modal_worker
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./collections.toml:/app/collections.toml:ro
    command: ["python", "-m", "src.workers.run_modal_worker"]
    restart: unless-stopped

  # Voice catalog worker (Phase 7.9). Hosts VoiceCatalogWorkflow plus the
  # status/store/upload activities in the voices namespace, which owns
  # data/voices. The design half runs outside the compose network, on the GPU
  # box (Deploy.md section 8).
  voice-catalog-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_engine_voice_catalog_worker
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./collections.toml:/app/collections.toml:ro
    command: ["python", "-m", "src.workers.run_voice_worker", "--role", "catalog"]
    restart: unless-stopped

  # WhatsApp delivery gateway (Baileys, blakegt/whatsapp-web-api-rest). Not
  # reachable from outside the compose network; the worker talks to it as
  # http://there:8085. The gateway exposes NO auth, so it must stay internal.
  # Pairing is done manually once (GET / returns the QR; see Deploy.md). The
  # Baileys session lives in /app/auth_info (resolved against cwd=/app), which
  # is mounted from ./data/there so the pairing survives restarts. The container
  # user is uid 1001, so the host dir must be owned by 1001.
  there:
    image: blakegt/whatsapp-web-api-rest:latest
    container_name: news_engine_there
    volumes:
      - ./data/there:/app/auth_info
    restart: unless-stopped

  temporal-postgres:
    image: postgres:13
    container_name: news_engine_temporal_postgres
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    volumes:
      - temporal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    container_name: news_engine_temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/$(hostname -i)/7233' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    container_name: news_engine_temporal_ui
    depends_on:
      - temporal
    ports:
      - "8081:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8081
    restart: unless-stopped

volumes:
  temporal_pg_data: