services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_engine_api
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./collections.toml:/app/collections.toml
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_engine_worker
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./collections.toml:/app/collections.toml:ro
    command: ["python", "-m", "src.workers.run_worker"]
    restart: unless-stopped

  # WhatsApp delivery gateway (Baileys, blakegt/whatsapp-web-api-rest). Not
  # reachable from outside the compose network; the worker talks to it as
  # http://there:8085. The gateway exposes NO auth, so it must stay internal.
  # Pairing is done manually once (GET / returns the QR; see Deploy.md). Session
  # state is mounted under ./data/there so the pairing survives restarts.
  there:
    image: blakegt/whatsapp-web-api-rest:latest
    container_name: news_engine_there
    volumes:
      - ./data/there:/app/session
    restart: unless-stopped

  temporal-postgres:
    image: postgres:13
    container_name: news_engine_temporal_postgres
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    volumes:
      - temporal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    container_name: news_engine_temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/$(hostname -i)/7233' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    container_name: news_engine_temporal_ui
    depends_on:
      - temporal
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    restart: unless-stopped

volumes:
  temporal_pg_data: