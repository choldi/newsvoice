[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tts-contract"
version = "0.1.0"
description = "Shared Pydantic models (TTS contract) for newsvoice monorepo"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3.0"]

[tool.hatch.build.targets.wheel]
packages = ["tts_contract"]

[tool.hatch.build.targets.sdist]
packages = ["tts_contract"]

# Mirrors the gateway ruleset (MERGE_PLAN decision 4) so the shared lib lints
# the same way wherever ruff is invoked from.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL", "PTH", "TID", "ARG", "C4", "N", "Q", "RUF"]
ignore = ["S101", "S311", "S603", "S607", "B008", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["tts_contract"]
