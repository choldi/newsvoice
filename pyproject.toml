[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-engine"
version = "0.4.0"
description = "AI News Digest Engine - Daily curated news digest from RSS feeds using local LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "litellm>=1.30.0",
    "structlog>=24.1.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "edge-tts>=6.1.0",
    "temporalio>=1.32.0",
    "feedparser>=6.0.10",
    "trafilatura>=1.8.0",
    "pypdf>=5.0.0",
    "ebooklib>=0.18",
    "python-multipart>=0.0.9",
    "markdown>=3.0.0",
    "bcrypt>=4.1.0",
    "modal>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
