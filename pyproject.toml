[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "newsvoice"
version = "0.0.1"
description = "Unified monorepo (news-engine + tts-api gateway) with uv workspace"
requires-python = ">=3.11,<3.13"
readme = "README.md"

[tool.uv.workspace]
members = ["apps/news", "apps/gateway", "libs/tts_contract"]

# The root is a workspace aggregator, not a distributable package. Without this
# `uv sync` tries to build `newsvoice` with hatchling and fails (no `newsvoice/`
# module directory).
[tool.uv]
package = false

[tool.uv.sources]
tts-contract = { workspace = true }
